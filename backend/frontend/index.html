<!DOCTYPE html>
<html>
<head>
  <title>AI Gaming Performance Coach</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f1a;
      color: white;
    }

    .container {
      padding: 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .card {
      background: #111827;
      padding: 20px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.4);
    }

    .value {
      font-size: 32px;
      font-weight: bold;
    }

    button {
      margin-top: 20px;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background: orange;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>AI Gaming Performance Coach</h1>

    <div class="grid">
      <div class="card">
        <h3>Aim Accuracy</h3>
        <div class="value" id="accuracy">--%</div>
      </div>

      <div class="card">
        <h3>Reaction Time</h3>
        <div class="value" id="reaction">-- ms</div>
      </div>

      <div class="card">
        <h3>KD Ratio</h3>
        <div class="value" id="kd">--</div>
      </div>
    </div>

    <div class="card" style="margin-top:20px;">
      <canvas id="sessionChart"></canvas>
    </div>

    <button onclick="analyze()">Analyze Performance</button>
  </div>

<script>
let chart;

function analyze() {
  fetch("http://127.0.0.1:5000/analyze")
    .then(r => r.json())
    .then(data => {

      document.getElementById("accuracy").innerText =
        data.accuracy + "%";

      document.getElementById("reaction").innerText =
        data.reaction + " ms";

      document.getElementById("kd").innerText =
        data.kd;

      if (chart) chart.destroy();

      chart = new Chart(
        document.getElementById("sessionChart"),
        {
          type: 'line',
          data: {
            labels: data.session.map((_, i) => i + 1),
            datasets: [{
              label: "Session Accuracy",
              data: data.session,
              borderColor: "orange",
              fill: false
            }]
          }
        }
      );
    });
}
</script>

</body>
</html>
